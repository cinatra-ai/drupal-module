services:
  # Stand-ins for the upstream registries, each holding one private item.
  # The exposure must serve the inner controller an EMPTY registry instead.
  mcp_tools.resource_registry:
    class: Drupal\cinatra_dev_site_probe\ProbeRegistry
    arguments: [['private resource']]
  mcp_tools.prompt_registry:
    class: Drupal\cinatra_dev_site_probe\ProbeRegistry
    arguments: [['private prompt']]
  # A stand-in for the client bridge; the exposure must serve it as absent.
  mcp_tools.client_bridge:
    class: Drupal\cinatra_dev_site_probe\ProbeRegistry
    arguments: [['client bridge']]
  # A plugin manager under the tool manager's id. While the exposure is
  # active the endpoint wraps it in the request's scoped tool manager.
  plugin.manager.tool:
    alias: plugin.manager.mail
