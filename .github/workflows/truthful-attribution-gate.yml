name: truthful-attribution-gate
# Thin caller for the organization's reusable truthful-attribution-gate. The
# engine is pinned twice, in the uses: line and in the ref: input, and both
# name the same commit of the shared engine, one the organization's merge
# machinery accepts. The comment on the uses: line is a build marker of that
# commit for the pinned-action gate, not a release tag. A maintained rollout
# tool moves both pins together with this repository's check suite.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read
  checks: read
  # actions:read is MANDATORY: the engine resolves a reusable-workflow check-run
  # to its Actions run (GET /actions/runs/{id}) to verify referenced_workflows[]
  # at the pinned SHA. With an explicit permissions block, any omitted scope
  # defaults to `none`, and a called reusable workflow cannot exceed the caller's
  # grant — so omitting this causes startup_failure (red/missing check), which
  # WARN mode CANNOT rescue (it fails before any step runs). Do not drop it.
  actions: read

jobs:
  truthful-attribution-gate:                 # caller job id MUST stay this exact string
    uses: cinatra-ai/ci/.github/workflows/truthful-attribution-gate.yml@7c767fe7fabc5e4fb93e2142987a2b2dff502014 # v0+engine.7c767fe7.grant.3
    with:
      mode: warn
      ref: 7c767fe7fabc5e4fb93e2142987a2b2dff502014 # engine 7c767fe7, grant revision 3
