name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  php-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: "8.3"
      - name: php -l (lint every PHP file)
        run: |
          set -e
          find . -path ./vendor -prune -o \( -name '*.php' -o -name '*.module' -o -name '*.install' \) -print | while read -r f; do
            php -l "$f"
          done

  php-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: "8.3"
      - name: Authenticated-preview auth + region-anchor contract (cinatra#2046)
        # Standalone harness (no Drupal install): the Standard-Webhooks preview
        # verification matrix, id binding, the freshness window, the owned-region
        # vocabulary, the anchor markup, and the render-flag inertness. The
        # drupal.org PHPUnit runner is currently skipped (see .gitlab-ci.yml
        # SKIP_PHPUNIT), so this is what actually gates the security boundary on
        # every pull request; the route-level integration lives in
        # tests/src/Functional/PreviewRouteTest.php.
        run: php tests/test-preview-auth.php

  js-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Widget mount + embed-bridge behavior tests (no bundler required)
        run: node tests/test-widget-negotiation.mjs
      - name: Widget source-of-truth drift / parity gate (cinatra#411)
        # Asserts the security-critical invariants on the canonical vendored
        # widget (js/cinatra-widget.js): no apiKey in the browser, the
        # tokenEndpoint broker + short-lived-token Bearer stream, the shared
        # contract-version set, and NO reintroduction of the dead
        # /api/{wordpress,drupal}/bundle.js route in shipped/admin/schema strings.
        # Identical to the wordpress-plugin gate (cross-repo lockstep). See
        # cinatra docs/widget-source-of-truth.md.
        run: node tools/widget-parity-check.mjs

  yaml-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate every YAML file parses
        run: |
          set -e
          python3 - <<'PY'
          import glob, sys, yaml
          bad = 0
          for f in glob.glob('**/*.yml', recursive=True) + glob.glob('**/*.yaml', recursive=True):
              try:
                  list(yaml.safe_load_all(open(f, encoding='utf-8')))
                  print(f"ok: {f}")
              except Exception as e:  # noqa: BLE001
                  print(f"BAD: {f}: {e}")
                  bad += 1
          sys.exit(1 if bad else 0)
          PY

  phpcs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Gating. The dev tooling (composer.json + phpcs.xml.dist) is in place and
    # the tree is phpcs-clean, so a regression must fail the build.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: "8.3"
          tools: composer
      - name: Install dev dependencies
        # Install from the project composer.json, whose config.allow-plugins
        # authorizes dealerdirect/phpcodesniffer-composer-installer (the missing
        # allow-plugins entry is what broke the previous global-require install).
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: PHPCS (Drupal, DrupalPractice)
        run: vendor/bin/phpcs -q

  phpstan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Gating. phpstan-drupal at the level pinned in phpstan.neon.dist; the tree
    # currently passes, so a regression must fail the build.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: "8.3"
          tools: composer
      - name: Install dev dependencies
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: PHPStan
        run: vendor/bin/phpstan analyse --no-progress

  # cinatra#2165 — PHP 8.5 ceiling gate.
  #
  # This module does not merely support a range on paper: it is bind-mounted
  # into, and executed by, the Cinatra Drupal companion container, whose base
  # image moved from php 8.3-apache to php 8.5-apache. Every gate above pins
  # 8.3, so the interpreter the module actually runs under in that container was
  # not exercised anywhere — a PHP 8.4/8.5 deprecation (implicitly-nullable
  # parameter declarations being the one that bites Drupal contrib hardest)
  # could land silently and only surface as a runtime notice inside the image.
  #
  # Deliberately ONE ADDITIVE JOB rather than a `strategy.matrix` on the jobs
  # above: a matrix rewrites their check names to "php-lint (8.3)" etc., and
  # `php-lint` / `phpcs` / `phpstan` are branch-protection REQUIRED contexts —
  # renaming them would leave the required checks pending forever. This job adds
  # a new context and touches none of the existing ones.
  #
  # `extensions:` is explicit because drupal/core declares `ext-gd` (and the
  # zip/dom/mbstring family) as hard Composer requirements; without them
  # `composer install` fails resolution before any analyser runs.
  php-85:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up PHP 8.5
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: "8.5"
          tools: composer
          extensions: gd, zip, dom, mbstring, curl, xml
      - name: php -l (lint every PHP file under 8.5)
        run: |
          set -e
          find . -path ./vendor -prune -o \( -name '*.php' -o -name '*.module' -o -name '*.install' \) -print | while read -r f; do
            php -l "$f"
          done
      - name: Authenticated-preview auth + region-anchor contract under 8.5
        # Same standalone harness the 8.3 job runs (see php-tests). E_ALL so a
        # deprecation raised while the harness exercises the module's own code
        # is visible in the log rather than swallowed.
        run: php -d error_reporting=E_ALL -d display_errors=1 tests/test-preview-auth.php
      - name: Install dev dependencies
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: PHPCS (Drupal, DrupalPractice) under 8.5
        run: vendor/bin/phpcs -q
      - name: PHPStan (with phpstan-deprecation-rules) under 8.5
        run: vendor/bin/phpstan analyse --no-progress
