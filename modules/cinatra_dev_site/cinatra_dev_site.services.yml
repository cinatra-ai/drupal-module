parameters:
  # The upstream remote controller that the endpoint wraps.
  cinatra_dev_site.remote_controller: 'Drupal\mcp_tools_remote\Controller\McpToolsRemoteController'
  # The registries the endpoint serves to it EMPTY, built with no provider.
  cinatra_dev_site.empty_registries:
    mcp_tools.resource_registry: 'Drupal\mcp_tools\Mcp\Resource\ResourceRegistry'
    mcp_tools.prompt_registry: 'Drupal\mcp_tools\Mcp\Prompt\PromptRegistry'
services:
  # The cinatra profile's permission callback (CinatraDevSite::GUARD_CALLBACK).
  cinatra_dev_site.profile_guard:
    class: Drupal\cinatra_dev_site\Mcp\ProfileToolGuard
    arguments: ['@request_stack']
  # Points the remote route at the endpoint while the exposure is active.
  cinatra_dev_site.route_subscriber:
    class: Drupal\cinatra_dev_site\Routing\DevSiteRouteSubscriber
    arguments: ['%cinatra_dev_site.remote_controller%']
    tags:
      - { name: event_subscriber }
  # Points the remote server id at the cinatra profile while active.
  cinatra_dev_site.config_override:
    class: Drupal\cinatra_dev_site\Config\DevSiteConfigOverride
    tags:
      - { name: config.factory.override, priority: 5 }
  # Binds node:page to editorial; as a subscriber it also transforms exports.
  cinatra_dev_site.editorial_binder:
    class: Drupal\cinatra_dev_site\Workflow\EditorialBinder
    arguments: ['@config.storage', '@entity_type.manager', '@state', '@content_moderation.moderation_information']
    tags:
      - { name: event_subscriber }
