cinatra.settings_form:
  path: '/admin/config/services/cinatra'
  defaults:
    _form: '\Drupal\cinatra\Form\SettingsForm'
    _title: 'Cinatra settings'
  requirements:
    _permission: 'administer site configuration'

# "Connect with Cinatra" OAuth-style callback (cinatra#221). cinatra-core 302s
# the admin's browser back here with ?code&state (or ?error). The path is PINNED
# by the cinatra-core redirect_uri contract (validateRedirectUri) and MUST match
# exactly — do not add a slug/param. CSRF for this off-site round-trip is the
# single-use, uid-bound, server-stored `state` (a Drupal form/route token cannot
# survive the external redirect), so no _csrf_token here; the handshake is still
# gated on 'administer site configuration'. The handshake is STARTED from the
# settings form's Connect button (a Form API submit that carries the form CSRF
# token); only this return leg is a standalone route.
cinatra.connect_callback:
  path: '/admin/config/services/cinatra/connect/callback'
  defaults:
    _controller: '\Drupal\cinatra\Controller\ConnectController::callback'
    _title: 'Connecting to Cinatra'
  methods: [GET]
  requirements:
    _permission: 'administer site configuration'
  options:
    no_cache: 'TRUE'

# RETIRED — the widget credential broker routes (cinatra#2674).
#
# This module used to expose three same-origin POST routes for the assistant
# widget: `/cinatra/token` minted a short-lived site transport token, and
# `/cinatra/widget-auth/{init,token}` relayed the per-user PKCE handshake to the
# instance. Each presented the long-lived integration key server-to-server and
# handed a bearer back to the browser, which handed it into the iframe.
#
# The iframe now runs that whole ceremony itself, on the Cinatra origin, and the
# instance's `/api/widget-auth/{init,token}` answer 410 Gone. So these routes are
# REMOVED rather than left relaying to a retired endpoint: a stale cached page
# that still POSTs to one gets a plain 404 from Drupal, no key-bearing request
# leaves this site, and nothing is logged as an upstream failure. There is no
# compatibility arm — the point of the change is that this site can no longer
# obtain a bearer at all.

# Host-facing AUTHENTICATED PREVIEW of a node, including an unpublished/draft
# one (cinatra#2046 — the Drupal render-plane counterpart of the WordPress
# plugin's /wp-json/cinatra/v1/preview/<id>). The connected Cinatra instance
# fetches this ONCE per review gate, server-to-server, and pins an inert capture
# of the rendered page so a reviewer sees the proposed change inside this site's
# own theme without the site ever being fetched again at view time.
#
# THE PATH PARAMETER IS A RAW `{nid}`, NOT AN UPCAST `{node}`. Drupal's
# parameter converter runs BEFORE access checking, so an upcast parameter would
# LOAD an unpublished node for an unsigned caller. With a raw integer the access
# check decides while the node is still just a number in a path
# (deny-before-load), and the controller loads it only after that.
#
# AUTH is the connect-provisioned Standard-Webhooks shared secret this module
# already signs its publish webhook with — the one credential both ends hold.
# The host presents webhook-id / webhook-timestamp / webhook-signature over the
# canonical content "preview.<nid>"; PreviewAccessCheck recomputes it with the
# same PublishWebhook::sign(), constant-time compares, enforces a 300s freshness
# window, and consumes the message id single-use. NO Drupal permission is
# involved: this is a server-to-server credential, not a user session — which is
# exactly why the check is a custom one and not `_permission`.
cinatra.preview:
  path: '/cinatra/preview/{nid}'
  defaults:
    _controller: '\Drupal\cinatra\Controller\PreviewController::preview'
    _title_callback: '\Drupal\cinatra\Controller\PreviewController::title'
  methods: [GET]
  requirements:
    nid: '\d+'
    _custom_access: '\Drupal\cinatra\Access\PreviewAccessCheck::access'
  options:
    no_cache: 'TRUE'
